name: 更新热榜
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 安装 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: 安装依赖
        run: pip install requests

      - name: 运行脚本
        run: python hot.py

      - name: 强制推送
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "HotRank Bot"
          git add hot_ranking.json
          git diff --staged --quiet && exit 0
          git commit -m "每日自动更新"
          git push origin main --force
